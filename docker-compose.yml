version: '3.8'

services:
  # 1. La Base de Données PostgreSQL
  database:
    image: postgres:15-alpine
    container_name: shop-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: shop_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  # 2. Le Backend Node.js
  backend:
    build: ./mon-shop-backend
    container_name: shop-backend
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=database
      - DB_USER=admin
      - DB_PASSWORD=mysecretpassword
      - DB_NAME=shop_db
      - DB_PORT=5432
    depends_on:
      - database
    restart: always

  # 3. Le Frontend
  frontend:
    build: ./mon-shop-frontend
    container_name: shop-frontend
    ports:
      - "3000:3000"
    environment:
      - API_URL=http://localhost:8080
    depends_on:
      - backend
    restart: always

  # 4. Interface graphique Adminer pour la BDD
  adminer:
    image: adminer
    container_name: shop-adminer
    ports:
      - "8081:8080"
    restart: always
    
volumes:
  pgdata: