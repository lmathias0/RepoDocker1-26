name: CI/CD Pipeline - Shop

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Récupérer le code source
      uses: actions/checkout@v4

    - name: ⚙️ Installer Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: 🔍 Lancer le Linting sur le Backend
      run: |
        cd mon-shop-backend
        npm install
        npm run lint

    - name: 🔍 Lancer le Linting sur le Frontend
      run: |
        cd mon-shop-frontend
        npm install
        npm run lint

    - name: 🐳 Configurer Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: 🧪 Tester la construction Docker Compose
      run: |
        docker compose config
        docker compose build